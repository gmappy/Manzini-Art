<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MANZINI — Virtual Gallery</title>
<style>
  :root { --wall:#E2A894; --ink:#2a1d17; --paper:#f7efe6; --gold:#b88a5a; --glass:rgba(32,22,18,.72); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#150f0d; color:var(--paper); font:15px/1.45 Georgia,'Times New Roman',serif; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #c:active { cursor:grabbing; }
  .hud { position:fixed; z-index:5; }
  .tl { top:max(12px,env(safe-area-inset-top)); left:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; max-width:calc(100% - 190px); }
  .tl b { font-size:22px; letter-spacing:.32em; font-weight:400; }
  #clock { font-style:italic; opacity:.85; }
  [popover] { margin:0; padding:0; border:0; background:transparent; color:var(--paper); }
  @supports not selector(:popover-open) { [popover]:not(.\:popover-open) { display:none; } }
  #visitors-popover:is(:popover-open, .\:popover-open) { display:block; }
  #visitors-popover { position:fixed; top:max(58px,calc(env(safe-area-inset-top) + 46px)); left:12px; width:min(320px,calc(100vw - 24px)); max-height:min(70vh,460px); overflow:auto; padding:14px; background:rgba(28,19,15,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.18); border-radius:14px; box-shadow:0 16px 40px rgba(0,0,0,.5); color:var(--paper); }
  .vp-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; font-size:13px; color:#d7c7bc; }
  .vp-head strong { color:var(--paper); font-size:15px; font-weight:400; letter-spacing:.04em; }
  #profile-form { display:grid; gap:8px; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,.14); }
  #profile-form label { font-size:12px; color:#d7c7bc; display:grid; gap:4px; }
  .vp-name-row { display:flex; gap:6px; }
  #visitor-name { flex:1; min-width:0; padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.24); background:rgba(255,255,255,.1); color:var(--paper); font:inherit; font-size:14px; }
  .swatches { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .swatch { width:22px; height:22px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer; background:var(--sw); }
  .swatch[aria-pressed="true"] { border-color:#fff; transform:scale(1.12); }
  #visitor-list { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  #visitor-list li { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:9px; background:rgba(255,255,255,.06); font-size:13px; }
  .v-dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .v-info { flex:1; min-width:0; }
  .v-info b { display:block; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .v-info small { display:block; font-size:11px; color:#cab8ac; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .v-go { padding:4px 10px; font-size:12px; flex:none; }
  #mp-notice { left:50%; transform:translateX(-50%); top:max(102px,calc(env(safe-area-inset-top) + 90px)); padding:5px 13px; border-radius:999px; font-size:13px; pointer-events:none; opacity:0; transition:opacity .4s; }
  #mp-notice.show { opacity:1; }
  .btn { background:var(--paper); color:var(--ink); border:0; border-radius:999px; padding:7px 14px; font:inherit; font-size:14px; text-decoration:none; cursor:pointer; }
  .presence-pill { display:inline-flex; align-items:center; gap:7px; background:var(--glass); color:var(--paper); border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .presence-pill .dot { width:8px; height:8px; border-radius:50%; background:#9e8f86; flex:none; }
  .presence-pill.live .dot { background:#5ad17a; box-shadow:0 0 8px rgba(90,209,122,.85); }
  .presence-pill.local .dot { background:#f0b354; box-shadow:0 0 8px rgba(240,179,84,.75); }
  .btn:focus-visible,input:focus-visible,#map:focus-visible,.swatch:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .glass { background:var(--glass); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.14); border-radius:14px; }
  .tr { top:max(12px,env(safe-area-inset-top)); right:12px; padding:8px; width:176px; }
  #map { width:100%; aspect-ratio:1; display:block; border-radius:10px; cursor:crosshair; }
  .tr label { display:flex; gap:6px; align-items:center; font-size:12px; margin-top:6px; }
  .tr input { flex:1; min-width:0; }
  .tr button { font-size:12px; padding:3px 9px; }
  #placard { left:12px; bottom:calc(86px + env(safe-area-inset-bottom)); width:min(380px,calc(100% - 24px)); padding:14px 16px; background:var(--paper); color:var(--ink); border-radius:4px; border-left:5px solid var(--gold); box-shadow:0 10px 30px rgba(0,0,0,.4); }
  #placard h2 { margin:0; font-size:21px; font-weight:700; }
  #placard .meta { font-style:italic; color:#6b5446; margin:2px 0 8px; }
  #placard p { margin:0; max-height:7.5em; overflow:auto; }
  #placard small { display:block; margin-top:8px; color:#8a7262; }
  #tour { left:50%; transform:translateX(-50%); bottom:max(14px,env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:center; padding:8px 10px; }
  #tour .step { min-width:74px; text-align:center; font-variant-numeric:tabular-nums; }
  #tour .btn[disabled] { opacity:.4; cursor:default; }
  #dpad { display:none; right:14px; bottom:calc(86px + env(safe-area-inset-bottom)); width:132px; height:132px; }
  #dpad button { position:absolute; width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.3); background:var(--glass); color:#fff; font-size:18px; touch-action:none; user-select:none; }
  #hint { left:50%; transform:translateX(-50%); top:max(58px,calc(env(safe-area-inset-top) + 46px)); padding:6px 14px; font-size:13px; pointer-events:none; transition:opacity .6s; text-align:center; }
  #fb { position:fixed; inset:0; z-index:9; overflow:auto; padding:24px 16px 48px; background:var(--wall); color:var(--ink); }
  #fb h1 { letter-spacing:.3em; font-weight:400; margin:0 0 6px; }
  #fb .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); margin-top:18px; }
  #fb figure { margin:0; background:var(--paper); padding:10px; border-radius:3px; }
  #fb img { width:100%; display:block; }
  @media (max-width:640px) { .tr { width:120px; padding:6px; } .tl { max-width:calc(100% - 140px); } .tl b { font-size:17px; } #dpad { display:block; } #tour .btn { padding:7px 11px; } }
  @media (prefers-reduced-motion:reduce) { #hint,#mp-notice { transition:none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="3D gallery view"></canvas>

<header class="hud tl">
  <b>MANZINI</b>
  <span id="clock"></span>
  <button id="presence-btn" class="btn presence-pill" type="button" commandfor="visitors-popover" command="toggle-popover" aria-expanded="false">
    <span class="dot" aria-hidden="true"></span>
    <span id="presence-label">Connecting…</span>
  </button>
</header>
<div id="visitors-popover" popover>
  <div class="vp-head"><strong>Visitors in gallery</strong><span id="mp-mode">Connecting…</span></div>
  <form id="profile-form" autocomplete="off">
    <label for="visitor-name">Your display name
      <div class="vp-name-row">
        <input id="visitor-name" maxlength="24" placeholder="Visitor" autocomplete="nickname">
        <button class="btn" type="submit">Save</button>
      </div>
    </label>
    <div class="swatches" id="swatches" role="group" aria-label="Avatar color"></div>
  </form>
  <ul id="visitor-list" aria-live="polite"></ul>
</div>
<div id="mp-notice" class="hud glass" role="status" aria-live="polite" hidden></div>
<div class="hud tr glass">
  <canvas id="map" width="360" height="360" tabindex="0" aria-label="Rotunda minimap. Click to move."></canvas>
  <label>Sky <input id="hour" type="range" min="0" max="24" step="0.25" aria-label="Time of day"><button id="live" class="btn" type="button">Live</button></label>
</div>
<aside id="placard" class="hud" hidden aria-live="polite"><h2></h2><div class="meta"></div><p></p><small></small></aside>
<nav id="tour" class="hud glass" aria-label="Guided tour">
  <button class="btn" id="prev" type="button">Previous</button>
  <button class="btn" id="play" type="button">Play tour</button>
  <span class="step" id="step">0/0</span>
  <button class="btn" id="next" type="button">Next</button>
</nav>
<div id="dpad" class="hud" aria-hidden="true">
  <button data-k="f" style="left:44px;top:0">▲</button><button data-k="b" style="left:44px;top:88px">▼</button>
  <button data-k="l" style="left:0;top:44px">◀</button><button data-k="r" style="left:88px;top:44px">▶</button>
</div>
<div id="hint" class="hud glass">Drag to look · WASD or arrows to walk · click the floor or an artwork to go there</div>
<div id="fb" hidden></div>

<script type="module">
  if (!('commandForElement' in HTMLButtonElement.prototype)) {
    import('https://esm.run/invokers-polyfill');
  }
  if (!Object.hasOwn(HTMLElement.prototype, 'popover')) {
    import('https://unpkg.com/@oddbird/popover-polyfill@latest/dist/popover.min.js');
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="store.js"></script>
<script src="multiplayer-config.js"></script>
<script>
(function () {
  'use strict';
  const A = window.Manzini, $ = id => document.getElementById(id);
  const R = 9, HW = 4, WL = 22, H = 5, RH = 9.5, EYE = 1.7, TAU = Math.PI * 2;
  // Visitors always see the published exhibition.json. ?preview=1 shows the curator's local draft instead.
  const PREVIEW = /[?&]preview=1/.test(location.search);
  let state = A.defaults();
  const getState = () => PREVIEW ? Promise.resolve(A.load()) : A.published();

  /* ---------- 2D fallback when WebGL or three.js is unavailable ---------- */
  function fallback(msg) { getState().then(s => { state = s; drawFallback(msg); }); }
  function drawFallback(msg) {
    const fb = $('fb'); fb.hidden = false; document.querySelectorAll('.hud').forEach(e => e.hidden = true);
    fb.innerHTML = '<h1>MANZINI</h1><p></p><div class="grid"></div>';
    fb.querySelector('p').textContent = msg + ' Showing the exhibition as a list instead.';
    state.items.filter(i => i.slot).forEach(it => {
      const f = document.createElement('figure'), im = new Image(); im.alt = it.title; im.src = A.src(it);
      const c = document.createElement('figcaption'); c.innerHTML = '<b></b><br><i></i><p></p>';
      c.querySelector('b').textContent = it.title; c.querySelector('i').textContent = [it.creator, it.year].filter(Boolean).join(', ');
      c.querySelector('p').textContent = it.description; f.append(im, c); fb.querySelector('.grid').append(f);
    });
  }
  if (!window.THREE) return fallback('The 3D library could not be loaded.');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true }); } catch (e) { return fallback('WebGL is not available in this browser.'); }
  renderer.outputEncoding = THREE.sRGBEncoding;

  /* ---------- Scene ---------- */
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(70, 1, .1, 400);
  camera.rotation.order = 'YXZ';
  const cam = { pos: new THREE.Vector3(0, EYE, 4), yaw: 0, pitch: 0 };
  const hemi = new THREE.HemisphereLight(0xffffff, 0x6b5a50, .6); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1); scene.add(sun);
  const lamps = [];
  function lamp(x, z, y, range) { const l = new THREE.PointLight(0xffe2c0, .7, range, 1.6); l.position.set(x, y, z); scene.add(l); lamps.push(l); }

  // Sky dome (vertical gradient) + sun disc + stars
  const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false,
    uniforms: { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() } },
    vertexShader: 'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'uniform vec3 top,hor;varying vec3 p;void main(){gl_FragColor=vec4(mix(hor,top,smoothstep(-.05,.65,p.y)),1.);}' });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(300, 24, 16), skyMat));
  const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(7, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff2c0, fog: false })); scene.add(sunDisc);
  const sp = []; for (let i = 0; i < 500; i++) { const a = Math.random() * TAU, e = Math.random() * 1.4 + .05, r = 280; sp.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, depthWrite: false });
  scene.add(new THREE.Points(sg, starMat));
  const SK = [[0, '#050816', '#101733'], [5, '#141a3d', '#3a3560'], [6.5, '#5d7fb8', '#f7b58a'], [8.5, '#6fb2ee', '#cfe6f5'], [12, '#4a9fe8', '#bfe0f7'],
    [16, '#5aa6e6', '#d6e8f2'], [18.5, '#5a74b0', '#f59a63'], [20, '#1d2147', '#5a3f66'], [24, '#050816', '#101733']];
  const c1 = new THREE.Color(), c2 = new THREE.Color();
  function skyAt(h, idx, out) { let i = 0; while (i < SK.length - 2 && h > SK[i + 1][0]) i++; const a = SK[i], b = SK[i + 1], t = Math.min(1, Math.max(0, (h - a[0]) / (b[0] - a[0])));
    c1.set(a[idx]); c2.set(b[idx]); out.copy(c1).lerp(c2, t); }
  function applyTime(h) {
    skyAt(h, 1, skyMat.uniforms.top.value); skyAt(h, 2, skyMat.uniforms.hor.value);
    const a = Math.PI * (h - 6) / 12, el = Math.sin(a), day = Math.min(1, Math.max(0, el * 2 + .3));
    sun.position.set(Math.cos(a) * 60, Math.max(el, .05) * 60, 25); sun.intensity = Math.max(0, el) * 1.1;
    sun.color.setHSL(.09, .8, .65 + Math.min(.3, el * .6));
    hemi.intensity = .28 + .45 * day; lamps.forEach(l => l.intensity = .55 + (1 - day) * .4);
    sunDisc.position.set(Math.cos(a) * 250, el * 250, 100); sunDisc.visible = el > -.08;
    starMat.opacity = 1 - day; renderer.setClearColor(skyMat.uniforms.hor.value);
  }

  /* ---------- Architecture ---------- */
  const M = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .85 }, o || {}));
  const wallM = M(0xE2A894, { side: THREE.DoubleSide }), trimM = M(0xf3e7da, { roughness: .6 }), floorM = M(0xcdb59b, { roughness: .55 }), goldM = M(0xb88a5a, { metalness: .6, roughness: .35 });
  const world = new THREE.Group(); scene.add(world);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), M(0x39423a)); ground.rotation.x = -Math.PI / 2; ground.position.y = -.05; world.add(ground);
  const rFloor = new THREE.Mesh(new THREE.CircleGeometry(R + .2, 64), floorM); rFloor.rotation.x = -Math.PI / 2; world.add(rFloor);
  [[2.6, 2.9], [R - 1.2, R - .9]].forEach(r => { const m = new THREE.Mesh(new THREE.RingGeometry(r[0], r[1], 64), goldM); m.rotation.x = -Math.PI / 2; m.position.y = .01; world.add(m); });
  const gap = Math.asin(HW / R);
  for (let k = 0; k < 4; k++) {
    const phi = k * Math.PI / 2;
    const arc = new THREE.Mesh(new THREE.CylinderGeometry(R, R, RH, 32, 1, true, phi + gap, Math.PI / 2 - 2 * gap), wallM); arc.position.y = RH / 2; world.add(arc);
    // wing built in local coords (+z = outward), rotated into place
    const w = new THREE.Group(); w.rotation.y = phi; world.add(w);
    const len = R + WL - 5, cz = 5 + len / 2;
    const fl = new THREE.Mesh(new THREE.PlaneGeometry(HW * 2, len), floorM); fl.rotation.x = -Math.PI / 2; fl.position.set(0, 0, cz); w.add(fl);
    const run = new THREE.Mesh(new THREE.PlaneGeometry(1.6, len), M(0x7a3b34)); run.rotation.x = -Math.PI / 2; run.position.set(0, .01, cz); w.add(run);
    const ce = new THREE.Mesh(new THREE.PlaneGeometry(HW * 2 + .6, len), M(0xf6efe6, { side: THREE.DoubleSide })); ce.rotation.x = Math.PI / 2; ce.position.set(0, H, cz); w.add(ce);
    [-1, 1].forEach(s => {
      const wl = new THREE.Mesh(new THREE.BoxGeometry(.3, H, len), wallM); wl.position.set(s * (HW + .15), H / 2, cz); w.add(wl);
      const bb = new THREE.Mesh(new THREE.BoxGeometry(.1, .28, len), trimM); bb.position.set(s * (HW - .03), .14, cz); w.add(bb);
      const cr = new THREE.Mesh(new THREE.BoxGeometry(.18, .22, len), trimM); cr.position.set(s * (HW - .06), H - .11, cz); w.add(cr);
    });
    const end = new THREE.Mesh(new THREE.BoxGeometry(HW * 2 + .6, H, .3), wallM); end.position.set(0, H / 2, R + WL + .15); w.add(end);
    const dx = Math.round(Math.sin(phi)), dz = Math.round(Math.cos(phi));
    lamp(dx * (R + 6), dz * (R + 6), H - .6, 16); lamp(dx * (R + 16), dz * (R + 16), H - .6, 16);
  }
  [0, RH - .1].forEach((y, i) => { const t = new THREE.Mesh(new THREE.TorusGeometry(R, i ? .18 : .1, 8, 64), trimM); t.rotation.x = Math.PI / 2; t.position.y = y + .1; world.add(t); });
  lamp(0, 0, 6, 26);
  // central sculpture
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.2, 1, 24), trimM); ped.position.y = .5; world.add(ped);
  const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(.7, .22, 96, 12), M(0xc8553d, { metalness: .5, roughness: .3 })); knot.position.y = 2.2; world.add(knot);

  /* ---------- Artworks ---------- */
  const artRoot = new THREE.Group(); scene.add(artRoot);
  let arts = [], pics = [], tour = [];
  const bx = new THREE.BoxGeometry(1, 1, .1), pl = new THREE.PlaneGeometry(1, 1), frameM = M(0x3b2a22, { roughness: .5 });
  const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
  function plaque(it) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 96; const x = c.getContext('2d');
    x.fillStyle = '#f6efe6'; x.fillRect(0, 0, 256, 96); x.strokeStyle = '#b88a5a'; x.lineWidth = 3; x.strokeRect(3, 3, 250, 90);
    x.fillStyle = '#2a1d17'; x.textAlign = 'center'; x.font = 'bold 22px Georgia,serif'; x.fillText(clip(it.title, 22), 128, 40);
    x.font = 'italic 17px Georgia,serif'; x.fillText(clip([it.creator, it.year].filter(Boolean).join(', '), 30), 128, 68);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }
  function loadTex(it, cb) {
    const fromImg = im => { const t = new THREE.Texture(im); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; t.needsUpdate = true; cb(t, im.width / im.height); };
    const gen = () => fromImg(A.genArt(A.hash(it.id)));
    if (!it.image || it.image.indexOf('gen:') === 0) return fromImg(A.genArt(+it.image.slice(4) || A.hash(it.id)));
    const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => fromImg(im); im.onerror = gen; im.src = it.image;
  }
  function buildArt() {
    while (artRoot.children.length) artRoot.remove(artRoot.children[0]);
    arts = []; pics = [];
    state.items.forEach(it => {
      const s = A.slot(it.slot); if (!s) return;
      const phi = s.wing * Math.PI / 2, dx = Math.round(Math.sin(phi)), dz = Math.round(Math.cos(phi)), px = -dz, pz = dx;
      const d = R + (s.row ? 15 : 5), lat = s.side * (HW - .06), nx = -s.side * px, nz = -s.side * pz;
      const g = new THREE.Group(); g.position.set(dx * d + px * lat, 2.2, dz * d + pz * lat); g.rotation.y = Math.atan2(nx, nz);
      const frame = new THREE.Mesh(bx, frameM), pic = new THREE.Mesh(pl, new THREE.MeshStandardMaterial({ color: 0x777777, roughness: .9 })); pic.position.z = .06;
      frame.scale.set(2.5, 2.3, 1); pic.scale.set(2.2, 2, 1);
      const pq = new THREE.Mesh(new THREE.PlaneGeometry(.9, .34), new THREE.MeshBasicMaterial({ map: plaque(it) })); pq.position.set(0, -1.35, .03);
      g.add(frame, pic, pq); artRoot.add(g);
      const e = { item: it, pos: g.position.clone(), yaw: Math.atan2(nx, nz), stop: new THREE.Vector3(g.position.x + nx * 3.4, EYE, g.position.z + nz * 3.4), slot: s };
      pic.userData.art = e; pics.push(pic); arts.push(e);
      loadTex(it, (tex, a) => {
        const w = a > 1.3 ? 2.8 : 2 * a, h = a > 1.3 ? 2.8 / a : 2; frame.scale.set(w + .3, h + .3, 1); pic.scale.set(w, h, 1);
        pic.material.dispose(); pic.material = new THREE.MeshStandardMaterial({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: .4, roughness: .9 });
      });
    });
    tour = A.tourList(state).map(i => arts.find(a => a.item.id === i.id)).filter(Boolean);
    ti = Math.min(ti, tour.length - 1); updTour();
  }

  /* ---------- Walkable area, regions, movement ---------- */
  const dirOf = k => { const p = k * Math.PI / 2; return [Math.round(Math.sin(p)), Math.round(Math.cos(p))]; };
  function region(x, z) {
    if (x * x + z * z < (R - .3) * (R - .3)) return -1;
    for (let k = 0; k < 4; k++) { const [dx, dz] = dirOf(k); if (x * dx + z * dz > R - 3 && Math.abs(-x * dz + z * dx) < HW) return k; }
    return -1;
  }

  }

  function startLocalBroadcast() {
    if (mpMode === 'ws' || typeof BroadcastChannel === 'undefined') {
      if (mpMode !== 'ws') { mpMode = 'offline'; renderPresenceUI(); }
      return;
    }
    if (!bc) {
      bc = new BroadcastChannel('manzini_presence_v1');
      bc.onmessage = ev => {
        if (mpMode !== 'local') return;
        const m = ev.data; if (!m || m.id === self.id) return;
        if (m.type === 'hello') {
          upsertPeer(m.peer, true);
          bc.postMessage({ type: 'here', id: self.id, peer: Object.assign({ id: self.id, name: self.name || 'Visitor', color: self.color }, currentPayload()) });
        } else if (m.type === 'here') {
          upsertPeer(m.peer, false);
        } else if (m.type === 'state' || m.type === 'meta') {
          upsertPeer(m, false);
        } else if (m.type === 'leave') {
          removePeer(m.id, true);
        }
      };
    }
    mpMode = 'local';
    if (!self.name) self.name = 'Visitor';
    $('visitor-name').value = self.name;
    bc.postMessage({ type: 'hello', id: self.id, peer: Object.assign({ id: self.id, name: self.name, color: self.color }, currentPayload()) });
    renderPresenceUI();
  }

  function resolveWsUrl() {
    const qs = new URLSearchParams(location.search).get('ws');
    if (qs) return qs;
    if (window.MANZINI_WS_URL) return window.MANZINI_WS_URL;
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    }
    return '';
  }

  function connectMultiplayer() {
    const url = resolveWsUrl();
    if (!url || typeof WebSocket === 'undefined') { startLocalBroadcast(); return; }
    mpMode = 'connecting'; renderPresenceUI();
    let opened = false;
    try { ws = new WebSocket(url); } catch (e) { startLocalBroadcast(); return; }

    ws.onopen = () => {
      opened = true; retryDelay = 1500;
      if (bc && mpMode === 'local') clearPeers();
      mpMode = 'ws'; lastSent.x = NaN;
      renderPresenceUI();
    };

    ws.onmessage = ev => {
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (!msg || !msg.type) return;
      if (msg.type === 'welcome') {
        self.id = msg.id;
        if (!self.name) self.name = msg.name || 'Visitor';
        if (!lsGet('manzini_visitor_color') && msg.color) self.color = msg.color;
        $('visitor-name').value = self.name;
        renderSwatches();
        clearPeers();
        (msg.peers || []).forEach(p => upsertPeer(p, false));
        sendMeta();
        lastSent.x = NaN; syncPresence(performance.now());
        renderPresenceUI();
      } else if (msg.type === 'join') {
        upsertPeer(msg.peer, true);
      } else if (msg.type === 'state' || msg.type === 'meta') {
        if (msg.id === self.id) {
          if (msg.name) self.name = msg.name;
          if (msg.color) self.color = msg.color;
          renderPresenceUI();
        } else {
          upsertPeer(msg, false);
        }
      } else if (msg.type === 'leave') {
        removePeer(msg.id, true);
      }
    };

    ws.onclose = () => {
      ws = null;
      if (opened) {
        clearPeers();
        mpMode = 'offline';
        renderPresenceUI();
      } else {
        startLocalBroadcast();
      }
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        retryDelay = Math.min(12000, Math.round(retryDelay * 1.6));
        connectMultiplayer();
      }, opened ? retryDelay : 8000);
    };
  }

  let saveBtnTimer = null;
  $('profile-form').addEventListener('submit', e => {
    e.preventDefault();
    const val = $('visitor-name').value.trim().slice(0, 24);
    if (val) { self.name = val; lsSet('manzini_visitor_name', val); }
    sendMeta();
    renderPresenceUI();
    const btn = $('profile-form').querySelector('button[type="submit"]');
    if (btn) {
      btn.textContent = 'Saved';
      clearTimeout(saveBtnTimer);
      saveBtnTimer = setTimeout(() => { btn.textContent = 'Save'; }, 1500);
    }
  });

  function isPopoverOpen(pop) {
    if (!pop) return false;
    if (pop.classList.contains(':popover-open')) return true;
    try { return pop.matches(':popover-open'); } catch (e) { return false; }
  }

  $('visitors-popover').addEventListener('toggle', e => {
    const pop = $('visitors-popover');
    const open = e.newState === 'open' || isPopoverOpen(pop);
    $('presence-btn').setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) {
      for (const k in keys) keys[k] = 0;
      $('visitor-name').value = self.name;
      renderPresenceUI();
    }
  });

  addEventListener('pagehide', () => {
    if (bc && mpMode === 'local') { try { bc.postMessage({ type: 'leave', id: self.id }); } catch (e) {} }
  });

  renderSwatches();
  renderPresenceUI();
  connectMultiplayer();

  /* ---------- Main loop ---------- */
  function resize() { renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 82 : 68; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  if (PREVIEW) addEventListener('storage', e => { if (e.key === A.KEY) { state = A.load(); setCur(null); buildArt(); } });
  let last = performance.now(), frame = 0, pickT = 0;
  function loop(now) {
    requestAnimationFrame(loop); const dt = Math.min(.05, (now - last) / 1000); last = now; frame++;
    const mv = keys.f - keys.b, st = keys.r - keys.l, tr = keys.tr - keys.tl;
    if (mv || st || tr) { if (tw) { tw = null; } playing = false; updTour(); }
    if (tr) cam.yaw -= tr * 1.8 * dt;
    if (tw) stepTween(dt);
    else if (mv || st) {
      const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw), sp = 4.2 * dt;
      let vx = (-sy * mv + cy * st), vz = (-cy * mv - sy * st); const l = Math.hypot(vx, vz) || 1; vx = vx / l * sp; vz = vz / l * sp;
      if (inside(cam.pos.x + vx, cam.pos.z)) cam.pos.x += vx; if (inside(cam.pos.x, cam.pos.z + vz)) cam.pos.z += vz;
    } else if (playing && tour.length && now - arrivedAt > 7000) goStop(ti + 1);
    camera.position.set(cam.pos.x, cam.pos.y + (tw ? 0 : Math.sin(now / 900) * .004), cam.pos.z); camera.rotation.set(cam.pitch, cam.yaw, 0);
    knot.rotation.y += dt * .5; knot.rotation.x += dt * .2;
    updatePeers(dt, now);
    syncPresence(now);
    if (now - pickT > 200) { pickT = now; // placard follows what the visitor is looking at
      ray.setFromCamera(new THREE.Vector2(0, 0), camera); const h = ray.intersectObjects(pics)[0];
      if (h && h.distance < 12) setCur(h.object.userData.art); else if (cur && cur.pos.distanceTo(cam.pos) > 8) setCur(null); }
    if (frame % 60 === 1) { applyTime(curH()); showClock(); }
    if (frame % 60 === 31 && isPopoverOpen($('visitors-popover'))) renderPresenceUI();
    if (frame % 2 === 0) drawMap();
    renderer.render(scene, camera);
  }
  hr.value = nowH(); applyTime(nowH()); showClock(); requestAnimationFrame(loop);
  if (PREVIEW) { const b = document.createElement('span'); b.className = 'btn'; b.textContent = 'Draft preview'; document.querySelector('.tl').append(b); }
  getState().then(s => { state = s; setCur(null); buildArt(); });
  setTimeout(hideHint, 9000);
})();
</script>
</body>
</html>
